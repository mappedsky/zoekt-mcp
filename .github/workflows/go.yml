name: Go

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # A short pass on every change, seeded by the committed corpus. It is a
      # smoke test for the escaping and path-confinement invariants, not a
      # campaign; a real campaign belongs in a scheduled run.
      - name: Fuzz
        run: |
          for target in \
            FuzzExactAtomEncodesOneToken \
            FuzzPlainAtomEncodesOneToken \
            FuzzSearchDecodesArbitraryResponses; do
            go test ./internal/zoekt/ -run=X -fuzz="^$target\$" -fuzztime=20s
          done
          for target in \
            FuzzOpenStaysInsideTheRoot \
            FuzzBlameRangesAreBounded; do
            go test ./internal/gitrepo/ -run=X -fuzz="^$target\$" -fuzztime=20s
          done
